on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: Version
        required: false
name: Scraper
jobs:
  scraper:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Install ssconvert
        run: sudo apt-get -y --no-install-recommends install gnumeric
      - uses: actions/checkout@v3
      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true
      - name: Install scraper dependencies
        run: bundle install
        working-directory: scraper
      - name: Run scraper
        run: bash bootstrap.sh
        working-directory: scraper/scripts
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            scraper/scripts/data/*
            ! scraper/scripts/data/by-bank.tar
      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
  php:
    needs: scraper
    name: Post-scraper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          tools: phpunit, composer
      - run: composer install --no-interaction
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifact
          path: scraper/scripts/data
      - name: Extract artifact
        run: gunzip by-bank.tar.gz
        working-directory: scraper/scripts/data
      - run: phpunit --migrate-configuration -d memory_limit=-1
        env:
          RUN_DATASET_TESTS: true
      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
  release-notes:
    needs: scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifact
          path: scraper/scripts/data
      - name: Run release script
        run: bash release.sh
        working-directory: scraper/scripts
      - name: Save Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes.md
          path: scraper/scripts/release.md
      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
