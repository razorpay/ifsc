name: "Ruby Gem Publish"

on:
  release:
    types: [published]

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      # Checkout code if release was created
      - uses: actions/checkout@v3
      # Setup ruby if a release was created
      - uses: ruby/setup-ruby@v1
        with:
          # Not needed with a .ruby-version file
          ruby-version: 3.1
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Setup PMG (malicious package protection)
        uses: safedep/pmg@v1
        with:
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      # Publish
      - name: publish gem
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
          gem build *.gemspec
          gem push *.gem
        env:
          # Make sure to update the secret name
          # if yours isn't named RUBYGEMS_AUTH_TOKEN
          GEM_HOST_API_KEY: "${{secrets.IFSC_GEM_ACCESS_TOKEN}}"
      - name: Sync PMG audit events to SafeDep Cloud
        if: always()
        run: pmg cloud sync --timeout 60s
